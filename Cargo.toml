[workspace]
resolver = "2"
members = ["proto", "core", "client", "server", "desktop"]

[workspace.package]
version = "3.9.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["blueokanna", "lxien", "orbien-org", "HyphenTeam"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-size]
inherits = "release"
opt-level = "z"

[workspace.dependencies]
orbien-proto = { path = "proto" }
orbien-core = { path = "core" }
orbien-client = { path = "client" }
nextjson = { version = "0.1.4", default-features = false, features = [
    "derive",
] }
rustbinary = { version = "0.1.8", default-features = false, features = [
    "derive",
    "compact",
] }
recurse-x = "0.2.3"
courierust = "1.0.9"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["io", "compat", "rt"] }
yamux = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
uuid = { version = "1", features = ["v4"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = "1"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rcgen = "0.13"
socket2 = "0.5"
kcp-tokio = "0.7"
httparse = "1"
rust-embed = "8"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
tls-parser = "0.12"
