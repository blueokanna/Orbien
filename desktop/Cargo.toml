[package]
name = "orbien-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Orbien Desktop - native Slint UI (in-process client)"
build = "build.rs"

[[bin]]
name = "orbien-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.17", features = ["unstable-winit-030"] }
orbien-client = { workspace = true }
orbien-core = { workspace = true }
orbien-proto = { workspace = true }
nextjson = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
uuid = { workspace = true }
libc = "0.2"
async-trait = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
sha1 = "0.10"
percent-encoding = "2"
rcgen = { workspace = true }
rustls = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
